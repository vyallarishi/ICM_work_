[project]
name = "multilingual-icm"
version = "0.1.0"
description = "Generate multilingual GSM8K candidate reasoning chains for ICM label convergence."
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=3.6.0",
    "huggingface-hub>=0.31.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "transformers>=4.51.0",
    "vllm>=0.8.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
